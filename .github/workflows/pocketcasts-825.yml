name: Pocket Casts 8.25 experimental bundle
on:
  push:
    branches:
      - pocketcasts-825-experimental
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Morphe patch bundle
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: pocketcasts-825-experimental-morphe
          path: patches/build/libs/*.mpp
          if-no-files-found: error
